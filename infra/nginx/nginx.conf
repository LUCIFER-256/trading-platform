events {}

http {
    limit_req_zone $binary_remote_addr zone=api_by_ip:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=login_by_ip:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=csrf_by_ip:10m rate=30r/m;
    limit_req_status 429;
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;
        return 308 https://localhost$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name localhost;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/trading-platform/tls/localhost.pem;
        ssl_certificate_key /etc/trading-platform/tls/localhost-key.pem;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        client_max_body_size 8k;
        large_client_header_buffers 2 4k;
        client_header_timeout 15s;
        client_body_timeout 25s;
        keepalive_timeout 5s;
        send_timeout 20s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_request_buffering off;
        limit_req zone=api_by_ip burst=20 nodelay;
        error_page 400 = @invalid_request;
        error_page 408 = @request_timeout;
        error_page 413 = @request_too_large;
        error_page 429 = @rate_limited;
        error_page 431 494 = @headers_too_large;

        location = /v1/auth/login { limit_req zone=login_by_ip burst=9 nodelay; include /etc/nginx/proxy_params; proxy_pass http://unix:/run/trading-platform/api.sock:; }
        location = /v1/auth/csrf { limit_req zone=csrf_by_ip burst=5 nodelay; include /etc/nginx/proxy_params; proxy_pass http://unix:/run/trading-platform/api.sock:; }
        location = /v1/auth/logout { include /etc/nginx/proxy_params; proxy_pass http://unix:/run/trading-platform/api.sock:; }
        location / { include /etc/nginx/proxy_params; proxy_pass http://unix:/run/trading-platform/api.sock:; }
        location @invalid_request { internal; default_type application/json; add_header Cache-Control no-store always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; return 400 '{"error":"invalid_request"}'; }
        location @request_timeout { internal; default_type application/json; add_header Cache-Control no-store always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; return 408 '{"error":"invalid_request"}'; }
        location @request_too_large { internal; default_type application/json; add_header Cache-Control no-store always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; return 413 '{"error":"request_too_large"}'; }
        location @rate_limited { internal; default_type application/json; add_header Cache-Control no-store always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Retry-After 6 always; return 429 '{"error":"rate_limited"}'; }
        location @headers_too_large { internal; default_type application/json; add_header Cache-Control no-store always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; return 431 '{"error":"request_headers_too_large"}'; }
    }
}
