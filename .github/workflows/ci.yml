name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:architecture
      - run: npm test
      - run: npm audit
      - if: github.event_name == 'pull_request'
        run: npm run check:migration-immutability -- ${{ github.event.pull_request.base.sha }}
